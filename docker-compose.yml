services:
  db:
    image: postgres:16-alpine
    container_name: night_mode_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-night_mode}
      POSTGRES_USER: ${POSTGRES_USER:-night_mode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-night_mode}
    ports:
      - '${POSTGRES_HOST_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-5434}:5432'
    volumes:
      - night_mode_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-night_mode} -d ${POSTGRES_DB:-night_mode}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: night_mode_backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-night_mode}:${POSTGRES_PASSWORD:-night_mode}@db:5432/${POSTGRES_DB:-night_mode}
    ports:
      - '${BACKEND_HOST_BIND:-127.0.0.1}:${BACKEND_HOST_PORT:-8000}:8000'
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: night_mode_bot
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-night_mode}:${POSTGRES_PASSWORD:-night_mode}@db:5432/${POSTGRES_DB:-night_mode}
    command: ["python", "-m", "app.bot.main"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-}
    container_name: night_mode_frontend
    environment:
      NODE_ENV: production
    expose:
      - '3000'
    restart: unless-stopped

  nexara-boost:
    build:
      context: ../land_for_sales
      dockerfile: Dockerfile
    container_name: nexara_boost_app
    env_file:
      - ../land_for_sales/.env
    expose:
      - '8787'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/nexara-boost/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  gateway:
    image: caddy:2.8-alpine
    container_name: night_mode_gateway
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      nexara-boost:
        condition: service_healthy
    ports:
      - '${GATEWAY_HOST_BIND:-0.0.0.0}:${GATEWAY_HOST_PORT:-80}:80'
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  night_mode_postgres:
  caddy_data:
  caddy_config:
